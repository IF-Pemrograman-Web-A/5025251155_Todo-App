<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  <header class="site-header">
    <h1>My Todo List</h1>
    <p>Tidak perlu melihat seluruh anak tangga, cukup ambil langkah pertama saja.</p>
    <button type="button" class="btn btn-tema">Mode Gelap</button>
  </header>

  <main class="main-content" id="main-content" tabindex="-1">

    <section class="panel panel-list" aria-labelledby="judul-list">
      <h2 id="judul-list">My Tasks</h2>

      <ul class="todo-list">
      </ul>
      <hr>
      <div class="new-todo-form">
        <h3>Add New Todo</h3>
        <form action="#">
          <div class="form-group">
            <label for="new-judul">Judul</label>
            <input type="text" id="new-judul" name="new-judul" placeholder="Masukkan judul todo" aria-required="true">
          </div>

          <div class="form-group">
            <label for="new-deskripsi">Deskripsi</label>
            <input type="text" id="new-deskripsi" name="new-deskripsi" placeholder="Deskripsi singkat">
          </div>

          <div class="form-group">
            <label for="new-deadline">Deadline</label>
            <input type="date" id="new-deadline" name="new-deadline">
          </div>

          <div class="form-group">
            <label for="new-notifikasi">Waktu Notifikasi</label>
            <input type="datetime-local" id="new-notifikasi" name="new-notifikasi">
          </div>

          <div class="form-group" role="group" aria-labelledby="label-gambar">
            <span class="label-teks" id="label-gambar">Gambar</span>
            <video id="kamera-video" class="gambar-todo" autoplay playsinline muted hidden aria-label="Tampilan kamera"></video>
            <canvas id="kamera-canvas" hidden></canvas>
            <img id="preview-gambar" class="gambar-todo" alt="Pratinjau foto todo" hidden>
            <button type="button" class="btn btn-kamera" id="btn-kamera">Buka Kamera</button>
            <button type="button" class="btn btn-kamera" id="btn-foto" disabled>Ambil Foto</button>
          </div>

          <p class="pesan" id="pesan" role="status"></p>

          <button type="submit" class="btn btn-utama">Tambah</button>
        </form>
      </div>
    </section>

    <aside class="panel panel-detail" aria-labelledby="judul-detail">
      <h2 id="judul-detail">Todo Detail</h2>

      <form action="#" class="detail-form">
        <div class="form-group">
          <label for="detail-judul">Judul</label>
          <input type="text" id="detail-judul" name="detail-judul" value="Jogging tipis tipis" aria-required="true">
        </div>

        <div class="form-group">
          <label for="detail-deskripsi">Deskripsi</label>
          <textarea id="detail-deskripsi" name="detail-deskripsi" rows="6">Jogging santai keliling ITS sekitar 20-30 menit sebelum mulai kerjain tugas kuliah.</textarea>
        </div>

        <div class="form-group">
          <label for="detail-deadline">Deadline</label>
          <input type="date" id="detail-deadline" name="detail-deadline" value="2026-09-22">
        </div>

        <div class="form-group">
          <label for="detail-notifikasi">Waktu Notifikasi</label>
          <input type="datetime-local" id="detail-notifikasi" name="detail-notifikasi">
        </div>

        <div class="form-group">
          <label for="detail-status">Status</label>
          <select id="detail-status" name="detail-status">
            <option value="pending" selected>Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <div class="form-group">
          <span class="label-teks">Gambar</span>
          <img id="detail-gambar" class="gambar-todo" alt="" hidden>
          <p class="teks-kecil" id="detail-gambar-kosong">Belum ada gambar.</p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-utama">Simpan</button>
          <button type="button" class="btn btn-edit">Edit</button>
          <button type="button" class="btn btn-hapus">Hapus</button>
        </div>
      </form>
    </aside>
  </main>
  <footer class="site-footer">
    <p>Todo App PWEB 2026</p>
    <p>Wanhardo Jawak</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
